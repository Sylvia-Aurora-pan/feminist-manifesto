<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#12101a"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b4dff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(155,77,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(155,77,255,0)"/>
    </radialGradient>
    <radialGradient id="roseGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="rgba(225,29,116,0.06)"/>
      <stop offset="100%" stop-color="rgba(225,29,116,0)"/>
    </radialGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 浏览器顶栏 -->
  <rect x="0" y="0" width="800" height="32" fill="#141414" rx="0"/>
  <circle cx="16" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="34" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="16" r="5" fill="#28ca41"/>
  <text x="400" y="21" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="sans-serif" font-size="10">她 — 一份女性主义手稿</text>

  <!-- 页面背景 -->
  <rect x="0" y="32" width="800" height="468" fill="url(#bg)"/>
  <rect x="0" y="32" width="800" height="468" fill="url(#glow)"/>
  <rect x="0" y="32" width="800" height="468" fill="url(#roseGlow)"/>

  <!-- 装饰线 -->
  <line x1="100" y1="130" x2="300" y2="130" stroke="rgba(155,77,255,0.25)" stroke-width="0.5"/>
  <line x1="500" y1="370" x2="700" y2="370" stroke="rgba(225,29,116,0.2)" stroke-width="0.5"/>

  <!-- 核心大字 "她" -->
  <text x="400" y="210" text-anchor="middle"
        font-family="'Noto Serif SC','Songti SC',serif"
        font-size="120" font-weight="900"
        fill="url(#violetGrad)"
        opacity="0.92"
        filter="url(#textGlow)"
        letter-spacing="0">她</text>

  <!-- 副标题 -->
  <text x="400" y="260" text-anchor="middle"
        font-family="'Noto Serif SC',serif"
        font-size="20" font-weight="300"
        fill="rgba(250,250,247,0.7)"
        letter-spacing="4">一份女性主义手稿</text>

  <!-- 引文 -->
  <text x="400" y="305" text-anchor="middle"
        font-family="'Fraunces','Georgia',serif"
        font-size="13" font-style="italic"
        fill="rgba(250,250,247,0.38)"
        letter-spacing="1">她不是天生的，而是被塑造的。但塑造的反面，是重塑。</text>

  <!-- 底部标签 -->
  <rect x="330" y="350" width="60" height="24" rx="2" fill="none" stroke="rgba(155,77,255,0.3)" stroke-width="0.8"/>
  <text x="360" y="366" text-anchor="middle"
        font-family="sans-serif" font-size="9"
        fill="rgba(155,77,255,0.55)"
        letter-spacing="2">ESSAY</text>

  <rect x="400" y="350" width="70" height="24" rx="2" fill="none" stroke="rgba(225,29,116,0.25)" stroke-width="0.8"/>
  <text x="435" y="366" text-anchor="middle"
        font-family="sans-serif" font-size="9"
        fill="rgba(225,29,116,0.45)"
        letter-spacing="2">FEMINIST</text>

  <!-- 底部装饰波浪 -->
  <path d="M0 420 Q100 405 200 420 Q300 435 400 420 Q500 405 600 420 Q700 435 800 420 L800 500 L0 500 Z" fill="rgba(155,77,255,0.03)"/>
  <path d="M0 440 Q100 430 200 440 Q300 450 400 440 Q500 430 600 440 Q700 450 800 440 L800 500 L0 500 Z" fill="rgba(155,77,255,0.02)"/>
</svg>
