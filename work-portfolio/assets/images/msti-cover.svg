<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F4FD"/>
      <stop offset="40%" stop-color="#D6EFF9"/>
      <stop offset="80%" stop-color="#E0F4F4"/>
      <stop offset="100%" stop-color="#F0FAFA"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122e87"/>
      <stop offset="50%" stop-color="#0055A9"/>
      <stop offset="100%" stop-color="#0077B9"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055A9"/>
      <stop offset="100%" stop-color="#00B6B6"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(248,252,254,0.7)"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(0,85,169,0.12)"/>
    </filter>
  </defs>

  <!-- 浏览器顶栏 -->
  <rect x="0" y="0" width="800" height="32" fill="#2c2c2e" rx="0"/>
  <circle cx="16" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="34" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="16" r="5" fill="#28ca41"/>
  <text x="400" y="21" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-family="sans-serif" font-size="10">MSTI — 胃格测试</text>

  <!-- 页面背景 -->
  <rect x="0" y="32" width="800" height="468" fill="url(#bg)"/>

  <!-- 装饰背景圆 -->
  <circle cx="150" cy="180" r="180" fill="rgba(0,119,185,0.04)"/>
  <circle cx="650" cy="360" r="140" fill="rgba(0,182,182,0.04)"/>
  <circle cx="400" cy="120" r="80" fill="rgba(0,85,169,0.03)"/>

  <!-- 头部标题区 -->
  <text x="400" y="110" text-anchor="middle"
        font-family="'Noto Sans SC',sans-serif"
        font-size="32" font-weight="900"
        fill="#122e87"
        letter-spacing="2">MSTI 胃格测试</text>
  <text x="400" y="148" text-anchor="middle"
        font-family="'Noto Sans SC',sans-serif"
        font-size="15" fill="#5a7a8a"
        letter-spacing="1">测一测你的胃格类型，找到最适合的养胃方式</text>

  <!-- 装饰分隔线 -->
  <line x1="340" y1="168" x2="460" y2="168" stroke="rgba(0,85,169,0.15)" stroke-width="1"/>

  <!-- 主卡片 -->
  <rect x="120" y="200" width="560" height="210" rx="20" fill="url(#cardGlow)" stroke="#dce8f2" stroke-width="1" filter="url(#shadow)"/>

  <!-- 卡片内选项示意 -->
  <rect x="160" y="230" width="220" height="36" rx="18" fill="white" stroke="#e0eaf2" stroke-width="1"/>
  <text x="270" y="253" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">A. 胃酸分泌过多型</text>

  <rect x="420" y="230" width="220" height="36" rx="18" fill="white" stroke="#e0eaf2" stroke-width="1"/>
  <text x="530" y="253" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">B. 胃动力不足型</text>

  <rect x="160" y="282" width="220" height="36" rx="18" fill="white" stroke="#e0eaf2" stroke-width="1"/>
  <text x="270" y="305" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">C. 饮食不规律型</text>

  <rect x="420" y="282" width="220" height="36" rx="18" fill="white" stroke="#e0eaf2" stroke-width="1"/>
  <text x="530" y="305" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">D. 脾胃虚弱型</text>

  <!-- 进度指示 -->
  <text x="400" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#88a0b0">问题 1 / 6 · 预计 30 秒完成</text>

  <!-- 底部按钮 -->
  <rect x="300" y="370" width="200" height="42" rx="21" fill="url(#btnGrad)"/>
  <text x="400" y="396" text-anchor="middle"
        font-family="'Noto Sans SC',sans-serif"
        font-size="16" font-weight="700"
        fill="#ffffff">开始测试 →</text>

  <!-- 底部波浪装饰 -->
  <path d="M0 440 Q100 430 200 440 Q300 450 400 440 Q500 430 600 440 Q700 450 800 440 L800 500 L0 500 Z" fill="rgba(0,119,185,0.06)"/>
  <path d="M0 455 Q100 448 200 455 Q300 462 400 455 Q500 448 600 455 Q700 462 800 455 L800 500 L0 500 Z" fill="rgba(0,85,169,0.04)"/>
</svg>
